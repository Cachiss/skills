<!--
  Identidad del sitio · pega este bloque AL PRINCIPIO de <head>, justo después de charset y
  viewport y ANTES de cualquier CSS/JS inline (WhatsApp sólo lee los primeros ~300 KB del HTML).

  Sustituye: {{NOMBRE}} {{TAGLINE}} {{DESCRIPCION}} {{URL}} {{COLOR}}
  - {{URL}}: URL pública final, con https y sin barra al final (https://ejemplo.com)
  - {{DESCRIPCION}}: una frase, ≤ 160 caracteres
  - og:image DEBE ser absoluta y https. Relativa = sin preview.
-->
<title>{{NOMBRE}} — {{TAGLINE}}</title>
<meta name="description" content="{{DESCRIPCION}}">
<link rel="canonical" href="{{URL}}/">
<meta name="theme-color" content="{{COLOR}}">

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{NOMBRE}}">
<meta property="og:title" content="{{NOMBRE}} — {{TAGLINE}}">
<meta property="og:description" content="{{DESCRIPCION}}">
<meta property="og:url" content="{{URL}}/">
<meta property="og:image" content="{{URL}}/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo de {{NOMBRE}}">
<meta property="og:locale" content="es_MX">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{NOMBRE}} — {{TAGLINE}}">
<meta name="twitter:description" content="{{DESCRIPCION}}">
<meta name="twitter:image" content="{{URL}}/og-image.png">

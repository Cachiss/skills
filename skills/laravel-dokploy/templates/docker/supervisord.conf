[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
loglevel = info

[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl = unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
priority = 10
autostart = true
autorestart = true
startretries = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0


[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startretries = 3
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0


; Cola de trabajos. Se apaga poniendo RUN_QUEUE_WORKER=false.
[program:queue]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=10 --timeout=120 --max-time=3600
directory = /var/www/html
user = www-data
process_name = %(program_name)s_%(process_num)02d
numprocs = %(ENV_QUEUE_WORKERS)s
priority = 30
autostart = %(ENV_RUN_QUEUE_WORKER)s
autorestart = true
stopsignal = TERM
stopwaitsecs = 130
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0


; Scheduler de Laravel. Se apaga poniendo RUN_SCHEDULER=false.
[program:scheduler]
command = sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
directory = /var/www/html
user = www-data
priority = 40
autostart = %(ENV_RUN_SCHEDULER)s
autorestart = true
stopsignal = TERM
stopwaitsecs = 70
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.backlog = 1024

; CRÍTICO: sin esto php-fpm limpia el entorno y Laravel no ve las variables
; que Dokploy inyecta en el contenedor.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 30s
pm.status_path = /fpm-status

; Peticiones lentas (PDFs, exportaciones) se registran pero no se matan aquí:
; el límite real lo pone max_execution_time.
request_terminate_timeout = 300
request_slowlog_timeout = 30
slowlog = /dev/stderr

; Toda la salida de los workers a los logs del contenedor
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;
    client_max_body_size 64m;
    client_body_buffer_size 1m;
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path     /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;
    uwsgi_temp_path       /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path        /var/lib/nginx/tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml font/woff font/woff2
               image/svg+xml application/vnd.ms-fontobject;

    # Traefik termina TLS: confiamos en su cabecera para que Laravel genere
    # URLs https y no caiga en un bucle de redirección.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    map $http_x_forwarded_proto $fastcgi_https {
        default "";
        https   on;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Health check de Dokploy/Docker
        location = /up {
            try_files $uri /index.php?$query_string;
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Assets con hash (Vite) — caché agresiva
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Assets publicados por Filament/Livewire
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param HTTPS           $fastcgi_https if_not_empty;
            fastcgi_param REQUEST_SCHEME  $forwarded_scheme;

            fastcgi_hide_header X-Powered-By;

            # Margen para exportaciones, PDFs y subidas pesadas
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            internal;
        }

        # Nada de PHP suelto fuera de index.php
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
